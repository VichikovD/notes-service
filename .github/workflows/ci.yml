name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (spotless + checkstyle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Spotless + Checkstyle
        run: ./mvnw -B spotless:check checkstyle:check

  test:
    name: test (unit + integration + coverage)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers needs Docker; it is preinstalled on ubuntu-latest runners.
      - name: Verify (unit + integration + JaCoCo 70% gate)
        run: ./mvnw -B verify
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
      - name: Upload Surefire/Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

  build:
    name: build (executable jar)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package
        run: ./mvnw -B -DskipTests package
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: notes-service-jar
          path: target/notes-service.jar

  security-spotbugs:
    name: security (SpotBugs + find-sec-bugs)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: SpotBugs with find-sec-bugs
        run: ./mvnw -B -DskipTests compile spotbugs:check

  security-owasp:
    name: security (OWASP dependency-check)
    runs-on: ubuntu-latest
    needs: test
    # NVD database download is slow; run on pushes to main (and tags), not on every PR.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: OWASP Dependency-Check
        run: ./mvnw -B -Psecurity -DskipTests verify
      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*

  codeql:
    name: security (CodeQL SAST)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
      - name: Build for CodeQL
        run: ./mvnw -B -DskipTests compile
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  release:
    name: release (publish jar on tag)
    runs-on: ubuntu-latest
    needs: [ build, security-spotbugs, security-owasp, codeql ]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package release jar
        run: ./mvnw -B -DskipTests package
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/notes-service.jar
          generate_release_notes: true
