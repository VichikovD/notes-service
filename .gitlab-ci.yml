# GitLab CI/CD pipeline mirroring the GitHub Actions stages:
# lint -> test -> build -> security-check -> release
image: maven:3.9-eclipse-temurin-21

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-B -ntp"

# Cache the local Maven repository between jobs and pipelines.
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository

stages:
  - lint
  - test
  - build
  - security
  - release

lint:
  stage: lint
  script:
    - ./mvnw $MAVEN_CLI_OPTS spotless:check checkstyle:check

test:
  stage: test
  # Integration tests use Testcontainers, which needs a Docker daemon.
  # Docker-in-Docker service provides it; TESTCONTAINERS_HOST_OVERRIDE points TC at dind.
  services:
    - name: docker:24-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
    TESTCONTAINERS_RYUK_DISABLED: "true"
  script:
    - ./mvnw $MAVEN_CLI_OPTS verify
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    when: always
    paths:
      - target/site/jacoco
      - target/surefire-reports
      - target/failsafe-reports
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml

build:
  stage: build
  script:
    - ./mvnw $MAVEN_CLI_OPTS -DskipTests package
  artifacts:
    paths:
      - target/notes-service.jar
    expire_in: 1 week

spotbugs:
  stage: security
  script:
    - ./mvnw $MAVEN_CLI_OPTS -DskipTests compile spotbugs:check

dependency-check:
  stage: security
  script:
    - ./mvnw $MAVEN_CLI_OPTS -Psecurity -DskipTests verify
  artifacts:
    when: always
    paths:
      - target/dependency-check-report.html
      - target/dependency-check-report.json

release:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - ./mvnw $MAVEN_CLI_OPTS -DskipTests package
  artifacts:
    paths:
      - target/notes-service.jar
